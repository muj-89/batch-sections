<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Academic Sections Navigator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors">

  <!-- Header -->
  <header class="bg-indigo-700 dark:bg-gray-800 text-white p-4 md:p-6 shadow flex flex-col md:flex-row md:items-center md:justify-between gap-3">
    <div>
      <h1 class="text-xl md:text-2xl font-bold">🧭 Academic Sections Navigator</h1>
      <p class="text-sm opacity-90">Organized & managed by Muj</p>
    </div>

    <!-- Dark Mode Toggle -->
    <button onclick="toggleDarkMode()"
            class="bg-white/20 px-4 py-2 rounded hover:bg-white/30 text-sm">
      🌙 Dark Mode
    </button>
  </header>

  <!-- Main -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Add Link Form -->
    <section class="bg-white dark:bg-gray-800 dark:text-white rounded-2xl shadow p-6 md:col-span-1">
      <h2 class="text-lg font-semibold mb-4">➕ Add Group Link</h2>

      <input id="groupName" type="text" placeholder="Group Name"
             class="w-full mb-3 p-2 border rounded dark:bg-gray-700 dark:border-gray-600" />

      <input id="section" type="text" placeholder="Section Number (e.g. 201)"
             class="w-full mb-3 p-2 border rounded dark:bg-gray-700 dark:border-gray-600" />

      <select id="category"
              class="w-full mb-3 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
        <option value="male">👨‍🎓 Students</option>
        <option value="female">👩‍🎓 Students</option>
        <option value="general">🌐 General (All)</option>
      </select>

      <input id="link" type="url" placeholder="Group / Meeting Link"
             class="w-full mb-3 p-2 border rounded dark:bg-gray-700 dark:border-gray-600" />

      <button onclick="addLink()"
              class="w-full bg-indigo-700 hover:bg-indigo-800 text-white py-2 rounded">
        Save
      </button>
    </section>

    <!-- Sections -->
    <section class="md:col-span-2 space-y-6">

      <!-- Search -->
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow">
        <input id="search"
               oninput="render()"
               type="text"
               placeholder="🔍 Search by group or section..."
               class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" />
      </div>

      <!-- Male -->
      <div class="bg-white dark:bg-gray-800 dark:text-white rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold mb-4">👨‍🎓 Male Sections</h2>
        <div id="male" class="grid gap-4"></div>
      </div>

      <!-- Female -->
      <div class="bg-white dark:bg-gray-800 dark:text-white rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold mb-4">👩‍🎓 Female Sections</h2>
        <div id="female" class="grid gap-4"></div>
      </div>

      <!-- General -->
      <div class="bg-white dark:bg-gray-800 dark:text-white rounded-2xl shadow p-6">
        <h2 class="text-lg font-semibold mb-4">🌐 General Groups</h2>
        <div id="general" class="grid gap-4"></div>
      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="text-center text-sm text-gray-500 dark:text-gray-400 py-4">
    © 2026 – This platform belongs to Muj
  </footer>

  <!-- Script -->
  <script>
    let data = JSON.parse(localStorage.getItem('batchLinks')) || [];

    function render() {
      const q = document.getElementById('search')?.value.toLowerCase() || '';

      ['male', 'female', 'general'].forEach(cat => {
        document.getElementById(cat).innerHTML = '';
      });

      data.forEach((item, index) => {
        if (
          !item.group.toLowerCase().includes(q) &&
          !item.section.toLowerCase().includes(q)
        ) return;

        document.getElementById(item.category).innerHTML += `
          <div class="border rounded-xl p-4 flex justify-between items-center dark:border-gray-600">
            <div>
              <h3 class="font-bold">${item.group}</h3>
              <p class="text-sm text-gray-500 dark:text-gray-300">
                Section: ${item.section}
              </p>
            </div>

            <div class="flex gap-3 items-center">
              <a href="${item.link}" target="_blank"
                 class="text-indigo-700 dark:text-indigo-400 font-semibold">
                Open
              </a>

              <button onclick="deleteLink(${index})"
                      class="text-red-600 hover:text-red-800 font-semibold">
                🗑
              </button>
            </div>
          </div>
        `;
      });

      localStorage.setItem('batchLinks', JSON.stringify(data));
    }

    function addLink() {
      const group = document.getElementById('groupName').value;
      const section = document.getElementById('section').value || 'All';
      const category = document.getElementById('category').value;
      const link = document.getElementById('link').value;

      if (!group || !link) {
        alert('Please fill required fields');
        return;
      }

      data.push({ group, section, category, link });
      render();

      document.getElementById('groupName').value = '';
      document.getElementById('section').value = '';
      document.getElementById('link').value = '';
    }

    function deleteLink(index) {
      if (!confirm('Are you sure you want to delete this group?')) return;
      data.splice(index, 1);
      render();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem(
        'darkMode',
        document.documentElement.classList.contains('dark')
      );
    }

    if (localStorage.getItem('darkMode') === 'true') {
      document.documentElement.classList.add('dark');
    }

    render();
  </script>

</body>
</html>
